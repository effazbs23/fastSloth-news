name: News Automation Pipeline

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour on the hour; picks up any news since the last run
  workflow_dispatch: # also triggered on demand by the dashboard's Refresh button

# Posts are spaced 1-2 min apart inside a run - prevent the next hourly run from
# starting while the previous one is still posting (would risk double-posting the
# same story). The queued run just starts late.
concurrency:
  group: fastsloth-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Hard backstop so a hung script (e.g. a wedged DB connect) can never stall
    # the runner forever and block the next hourly run via the concurrency group.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies & Playwright Browser
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Execute Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python main_pipeline.py
