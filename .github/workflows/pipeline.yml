name: News Automation Pipeline

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour on the hour; picks up any news since the last run
  workflow_dispatch: # also triggered on demand by the dashboard's Refresh button

# Posts are spaced 0.5-1.5 min apart inside a run, so a run posting a full
# batch can span ~20-30 min - prevent the next hourly run from starting while
# the previous one is still posting (would risk double-posting the same
# story). The queued run just starts late.
concurrency:
  group: fastsloth-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Hard backstop: a wedged run self-kills instead of holding the concurrency
    # group forever and silently skipping the next hourly runs. 40 min gives a
    # full MAX_SOCIAL_POSTS_PER_RUN=20 run (~19-30 min of spacing, see
    # main_pipeline.py) comfortable headroom inside the hourly cadence.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Cache Playwright browser binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies & Playwright Browser
        run: |
          pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi
      - name: Execute Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python main_pipeline.py
