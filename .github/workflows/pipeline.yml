name: News Automation Pipeline

on:
  schedule:
    - cron: '17 * * * *' # Runs hourly at minute 17 (prevents queue spikes)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies & Playwright Browser
        run: |
          pip install requests beautifulsoup4 google-generativeai psycopg2-binary playwright
          playwright install --with-deps chromium
      - name: Execute Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python main_pipeline.py
